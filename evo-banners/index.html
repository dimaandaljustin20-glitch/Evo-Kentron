<script>
/* ==========================================================================
   LINKEDIN PROFILE FUNNEL  ·  THE ONE PLACE TO EDIT
   All copy, colors and links for the landing page, short form and thank-you
   page live in this block. Change it here, then run:  node build.js
   (build.js copies this block to the top of all three pages in /site.)

   Tips
   - Wrap a phrase in *stars* to set it in the italic serif accent.
   - Use \n for a line break in short headings.
   - Leave a link as "" to hide the thing that points to it.
   - Add ?look=light to any page URL to preview the light version.
   - The form field names (name, email, linkedin, need, offer) stay the same so
     the CRM connection keeps working. Change only the words.
   - To see which post or message an order came from, add ?src=a-short-name to the
     link you share, for example yoursite.com/?src=post1 or ?src=dm-2026. The name
     arrives with the order as "source".
   ========================================================================== */
const FUNNEL = {

  /* ---- LOOK ---------------------------------------------------------- */
  look: "dark",                    // "dark" or "light"
  colors: { accent: "#f2682a" },   // the one accent color, used on buttons and dots

  /* ---- WHO IT'S FROM ------------------------------------------------- */
  brand: {
    name: "Evo Banners by Justin",
    initials: "JD",
    photo: "",                     // e.g. "assets/justin.jpg". Empty shows the initials.
    footer: "Justin - LinkedIn Brand Strategist"
  },

  seo: {
    title: "LinkedIn banners that say what you do | Evo Banners by Justin",
    description: "Custom LinkedIn banners and Featured thumbnails for people who sell a service. From $98, delivered in under 48 hours, with unlimited revisions.",
    /* The picture that shows when the link is shared on LinkedIn or in a DM. It only works once url holds
       your live address, for example "https://evobanners.netlify.app". Leave url empty until the site is live. */
    url: "",
    image: "assets/og.png"
  },

  /* Shows a draft strip with a page switcher. Turn off before launch. */
  draftBadge: { show: true, text: "Concept draft, not live" },

  /* ---- THE OFFER ----------------------------------------------------- */
  offer: {
    cta: "I want a banner",         // the hero, top bar and closing buttons say this
    pick: "I want this",            // the three package buttons say this
    ask: "Have some questions? Ask Justin",   // quiet button that opens your LinkedIn DMs (links.dm)
    ctaHref: "#price"      // hero, top bar and closing buttons scroll to the packages. Each package button opens the order page.
  },

  /* ---- LINKS (empty = hidden) ---------------------------------------- */
  links: {
    dm: "",                        // your LinkedIn profile link, for the DM button
    recommendations: ""            // your LinkedIn recommendations section
  },

  /* ---- LANDING PAGE -------------------------------------------------- */
  /* The page answers one question at a time, in this order:
     1 hero (what is this?)   2 problem (why should I care?)   3 before and after (show me)
     4 what you get           5 Featured thumbnails (the add-on)   6 reviews and about (can I trust you?)
     7 how it works           8 pricing   9 FAQs   10 closing */
  landing: {
    /* Faint banners drifting behind the hero. Add up to 5 image paths, for example "assets/b1.png", to use real ones.
       Until then they are abstract panels. Leave the list empty to turn images off, set floaters to false to hide it all. */
    floaters: { show: true, images: [] },
    nav: [["Pricing", "#price"], ["What's the process", "#process"], ["FAQs", "#faq"]],

    /* 1. HERO. Other headlines you can swap in:
       "A LinkedIn banner that shows\n*who you are and what you offer*\nin three seconds."   (the round 41 one)
       "Your banner gets three seconds.\n*Make it say who you are and what you offer.*" */
    trusted: ["Trusted by ", "200+", " personal brands"],
    title: "Your banner gets three seconds.\n*Make it say what you do.*",
    what: "I design LinkedIn banners that tell visitors who you help, what they get and how to reach you. Yours in under 48 hours.",
    from: "From $98. Revisions until you're happy.",    // the small line under the button. "" hides it.
    /* The picture under the button: a profile with a banner blueprint on it.
       Put a real banner in image, for example "assets/hero.png", to show that instead of the drawing. */
    blueprint: {
      image: "",
      caption: "What goes on a banner that works",
      parts: [
        ["Who you help", "So the right people stop scrolling."],
        ["What they get", "Your offer in one line."],
        ["Proof", "A number, a name or a result."],
        ["One next step", "Book, message or follow."]
      ]
    },

    /* 2. PROBLEM. kind picks the drawing: "blank", "skyline" or "vague". *Stars* set a phrase in the italic serif. */
    problem: {
      title: "Someone likes your post and taps your profile. *What do they see?*",
      banners: [
        { kind: "blank",   name: "The default",       says: "Says nothing." },
        { kind: "skyline", name: "The stock skyline", says: "Says you like cities." },
        { kind: "vague",   name: "The pretty one",    says: "Looks nice. Still doesn't say what you do." }
      ],
      turn: "That's not because you're not good. It's because *your profile didn't say it for you.*",
      text: "They can't tell who you help or what to do next, so they go back to scrolling. Your banner is the biggest space on your page. It can carry your pitch, your proof and your next step before you write a single DM."
    },

    proof: {
      /* 6. REVIEWS. count = how many recommendations are on your LinkedIn profile right now. Keep it true. */
      count: "51",
      title: "*51 people* put it in writing",
      text: "That's how many recommendations are on my LinkedIn profile. Here are a few.",
      all: "Read all of them on LinkedIn",     // shows once links.recommendations is filled
      /* With 3 or fewer reviews they show as big quotes side by side. From 4 up they slide on their own and can be dragged.
         Get each person's okay before this goes live. Add photo: "assets/janette.jpg" to show their profile photo (initials show until then). */
      items: [
        { tag: "Consulting launch", photo: "", name: "Janette Castro", role: "Fractional Fundraising Leader | Nonprofit Consultant",
          quote: "Justin created an amazing set of LI banners for me to use in launching my new consulting business. He was super easy to work with and did a great job communicating the status of the banners while they were being created." },
        { tag: "Financial advisory", photo: "", name: "Rick Umbrio", role: "Financial Advisor | CPA, CIM, PFP, RRC",
          quote: "Justin did a great job developing the banners on my LinkedIn. Prompt and quick turnaround, and very easy to work with." }
      ],
      /* 3. BEFORE AND AFTER. Real banners with each owner's okay. Each sample is a before and after pair.
         Add before: "assets/s1-before.png", after: "assets/s1-after.png" to replace a placeholder. */
      samplesTitle: "Same profile. *Different first impression.*",
      samplesHint: "Tap banner to see the After",
      samplesHintBack: "Tap banner to see the Before",
      samples: [
        { label: "Sample 1", before: "", after: "" },
        { label: "Sample 2", before: "", after: "" },
        { label: "Sample 3", before: "", after: "" }
      ],
    },

    /* 4. WHAT YOU GET. Each line is [what it is, why it matters]. */
    included: {
      title: "What *$98* gets you",
      text: "One Premium Banner, built around your offer and your photo.",
      items: [
        ["2 to 3 layouts to choose from", "You pick the direction before anything is final."],
        ["Your banner, ready to upload", "High-resolution PNG files sized for LinkedIn. Nothing left for you to design."],
        ["A basic brand guideline", "Your colors, fonts and photo style on one page, so your next post matches without guessing."],
        ["Mockups on a real profile", "See how it looks in place before it goes live."],
        ["Revisions until you're happy", "Unlimited. You approve it before it goes up."],
        ["Delivered in under 48 hours", "Fast enough to be live this week."]
      ]
    },

    /* 5. FEATURED THUMBNAILS. The add-on that turns a $98 order into $146. */
    featured: {
      title: "Your banner gets the look. *Your Featured section gets the click.*",
      text: "Featured is where your booking link, newsletter or free guide lives. A matching thumbnail makes those links look like part of the same brand.",
      without: ["Without", "Three links, three different looks."],
      with: ["With matching thumbnails", "One brand, and a clear place to click."],
      price: "$48 each, or $146 together with your banner.",
      link: "See the packages"
    },

    about: {
      title: "Hey, I'm *Justin.*",
      text: "I design LinkedIn banners and Featured thumbnails for people who sell a service, mostly in finance, coaching and tech. I work from the Philippines and I've been doing freelance design for nearly three years. I read every design form myself, and you talk to me from the first message to the final file.",
      /* Three short facts under the text: [big part, small part]. Keep them true. */
      facts: [["200+", "profiles designed"], ["51", "LinkedIn recommendations"], ["48 hrs", "to your banner"]]
    },

    /* 7. HOW IT WORKS. big = the large time on the line. when is kept for the thank-you page. */
    process: {
      title: "About *six minutes* of your time",
      text: "Then I take it from there.",
      steps: [
        { title: "Pick a package and fill in the design form",
          text: "Choose what you need, then tell me about your offer and share your logo, photo and brand colors in one short form.",
          big: "5 min", when: "About 5 minutes", viz: "form" },
        { title: "Pay with PayPal",
          text: "After the form you get a PayPal link with your amount filled in. I start as soon as it's paid.",
          big: "1 min", when: "About 1 minute", viz: "pay" },
        { title: "Review, revise, receive",
          text: "I design your banner and share it with you. We tweak it until you're happy, then you get the final PNG files.",
          big: "48 hrs", when: "Under 48 hours", viz: "banner" }
      ]
    },

    /* 8. PRICING */
    pricing: {
      title: "Pick what your profile *needs*",
      /* `hl` marks the highlighted card (it also shows first on phones). `tag` is the small label on a card. `need` pre-selects that option in the form. */
      plans: [
        {
          name: "Premium Banner",
          price: "$98",
          unit: "",
          text: "Your offer, your photo, one clear message.",
          need: "Premium Banner",
          lines: [["Premium LinkedIn Banner", 1, 98]],   // what shows on the invoice
          features: [
            "2 to 3 layout options to choose from",
            "A basic brand guideline",
            "Banner mockups",
            "PNG files ready to upload",
            "Delivered in under 48 hours"
          ]
        },
        {
          name: "Banner and booking thumbnail",
          price: "$146",
          unit: "",
          hl: true,
          tag: "Justin's pick",
          text: "Your banner, plus a matching thumbnail that sends people to your booking link.",
          need: "Banner and booking link thumbnail",
          lines: [["Premium LinkedIn Banner", 1, 98], ["Featured Link Thumbnail", 1, 48]],
          features: [
            "Everything in the Premium Banner",
            "1 featured thumbnail for your booking link",
            "One look across your banner and your Featured section",
            "PNG files ready to upload"
          ]
        },
        {
          name: "A la carte",
          price: "$48",
          unit: "and up",      // shows until something is ticked, then the card shows the running total
          text: "Build your own set. Tick the pieces and set how many.",
          need: "A la carte",
          /* Prices here drive the live total. max = most a person can order. */
          menu: [
            { key: "banner", name: "Premium Banner",       price: 98, max: 1,  one: "Premium Banner" },
            { key: "slides", name: "Extra banner slides",  price: 48, max: 4,  needs: "banner", one: "extra banner slide", many: "extra banner slides" },
            { key: "thumbs", name: "Featured Link Thumbnail", price: 48, max: 10, one: "featured thumbnail", many: "featured thumbnails" }
          ],
          /* The more pieces in the order, the bigger the discount. [pieces needed, percent off]. Change the numbers here. */
          tiers: [[3, 5], [5, 10], [8, 15]],
          lockedHint: "Add the Premium Banner first",
          features: [
            "Sales Navigator users can run up to 5 slides",
            "PNG files ready to upload"
          ]
        }
      ],
      promo: "Comeback promo. These prices end Dec 31, 2026 at 11:59pm, then go up in 2027.",
      promoEnds: "2026-12-31"     // drives the "days left" label. After this date the promo line hides itself. "" hides only the label.
    },

    faq: {
      title: "Before you *order*",
      items: [
        { q: "What exactly do I get?", a: "PNG files ready to upload and mockups. The Premium Banner also includes 2 to 3 layout options and a basic brand guideline." },
        { q: "How fast?", a: "Your Premium Banner arrives in under 48 hours." },
        { q: "What if I want changes?", a: "Tell me what to adjust. I revise until you're satisfied." },
        { q: "How do I pay?", a: "Right after the design form, you get a PayPal link with your amount filled in. I start once it's paid. Prefer Wise? Message me on LinkedIn and I'll send a link." },
        { q: "Can I get a refund?", a: "Payments are non-refundable but transferable. You can apply yours to another service or a rescheduled project within 3 months of purchase. And revisions are unlimited, so we keep going until you're happy." },
        { q: "What do I need to send?", a: "Nothing up front. Pick a package and fill in the design form. It holds everything I need from you, like your offer, logo, photo and brand colors, so nothing gets sent in pieces." },
        { q: "What is a Featured thumbnail?", a: "It's the cover image for a link in your profile's Featured section, like your booking page or newsletter. I design it to match your banner so your profile looks like one brand." },
        { q: "Will the files be editable?", a: "No. The source files stay with me to keep the quality premium, and you get high-resolution PNG files ready to upload." },
        { q: "Is this for job seekers?", a: "No. This is built for personal brands who sell a service. If you're mainly looking for a job, it's not the right fit." }
      ]
    },

    final: {
      title: "Your profile already gets seen. *Make the banner count.*",
      text: "Pick a package, fill in the design form and pay. Your banner can be live this week."
    }
  },

  /* ---- ORDER PAGE: the design form (opens from each package button) -- */
  brief: {
    step: "Step 1 of 2",
    title: "Tell me about *your banner*",
    text: "This one short form holds everything I need from you. Next, you pay.",
    checks: ["Promo ends Dec 31, 2026", "Revisions until you're happy", "Your details stay with me"],
    emailSubject: "New LinkedIn banner order",
    summaryLabel: "Your order",
    change: "Change",
    fields: {
      name:     { label: "Your name", placeholder: "Jane Cruz" },
      email:    { label: "Email", placeholder: "you@email.com" },
      linkedin: { label: "LinkedIn profile link", placeholder: "https://linkedin.com/in/yourname" },
      need:     { label: "Package", options: [] },   // filled from the pricing plans
      offer:    { label: "What do you offer?", hint: "One or two sentences is plenty.", placeholder: "I help ... get ... without ..." },
      audience: { label: "Who do you want to attract? (optional)", placeholder: "Founders of small agencies, finance leaders, ..." },
      colors:   { label: "Brand colors or style (optional)", placeholder: "Navy and gold, clean and minimal, or paste hex codes" },
      assets:   { label: "Link to your logo and photo (optional)", hint: "A Google Drive or Dropbox folder works. Set it so anyone with the link can view.", placeholder: "https://drive.google.com/..." },
      notes:    { label: "Anything else I should know? (optional)", placeholder: "Banners you like, words to include, things to avoid" }
    },
    submit: "Continue to payment",
    fine: "Next you'll get your PayPal link. I read every form myself."
  },

  /* ---- INVOICE (made automatically from the order; shown on the pay page and saved as a PDF) ---- */
  invoice: {
    title: "*Invoice*",
    from: { name: "Justin Dimaandal", lines: ["dimaandaljustin20@gmail.com"] },   // shown to clients on the invoice. Delete a line to hide it.
    reminderTitle: "Payment reminder",
    reminderBold: "Non-refundable but transferable.",
    reminderText: "Payments can be applied to another service or a rescheduled project within 3 months of purchase.",
    thanks: "Thanks for doing business!",
    linkedinName: "Justin Dimaandal",
    heading: "Check your order",
    subheading: "Make sure everything is right, then pay below.",
    download: "Download invoice"
  },

  /* ---- PAID PAGE: opens when the client taps "Paid!" on the payment page ---- */
  paid: {
    step: "Payment sent",
    title: "Thanks! Now send me a DM.",
    text: "I'll confirm your payment and start on your banner. To match it to your order, message me this word on LinkedIn:",
    keyword: "PAID",                    // the word clients send you. Change it to anything you like.
    primary: "Message Justin on LinkedIn",
    after: "Then wait for my reply. I confirm your payment first, then I start.",
    emailSubject: "Client says they've paid"
  },

  /* ---- THANK-YOU PAGE ------------------------------------------------ */
  thanks: {
    step: "Details received",
    title: "Got it. Now *pay to start.*",
    text: "Your design form is in. Pay below and I'll start on your banner.",
    /* What happens after payment. */
    next: [
      { title: "I create and share your design", text: "I design your Premium Banner and share it with you in under 48 hours. The final files are not editable, which keeps the quality premium." },
      { title: "We make revisions (optional)", text: "If you want anything tweaked, tell me and we'll adjust it until you're happy." },
      { title: "You get your final banner", text: "Once you're happy, I deliver the high-resolution banner as PNG files, ready to upload." }
    ],
    primary: "Questions? Message me on LinkedIn",
    /* Payment links. Leave a link empty to hide that button. Nothing is connected, these are just links. */
    pay: {
      title: "Ready to pay?",
      text: "Your amount is filled in. I start as soon as the payment is confirmed.",
      fallback: "Message me on LinkedIn and I'll send your payment link.",
      paypalMe: "JustinDimaandal",              // your PayPal.me name, for example "justindimaandal" (the part after paypal.me/)
      paypalLabel: "Pay with PayPal",
      wiseLabel: "Pay with Wise",
      paidNote: "Already paid? Tap here so I know to check.",
      paidLabel: "Paid!",
      /* A Wise payment link for each package. The A la carte total changes, so use a link that lets the client type the amount. */
      wise: { "Banner and booking link thumbnail": "", "Premium Banner": "", "A la carte": "" }
    },
    emailLine: "You'll also get a short email from me in a few minutes."   // only true once the Brevo auto-reply is live
  }
};

<style>
/* ============================================================
   Funnel look, ported from the Evo Funnels Blueprint:
   near-black, copper-orange, tight grotesque headlines with an
   italic serif accent, pill buttons with the orange circle,
   hairline dark cards, a faint warm haze.
   Rule: an orange circle means "press me". Never decoration.
   Fonts: Inter Tight (400, 500, 600) and Instrument Serif italic (400).
   Never use a heavier weight, the browser would fake it.
   ============================================================ */
:root{
  --bg:#0a0908; --herobg:#0c0a09; --card:#121010; --card2:#1b1816;
  --line:rgba(255,238,220,.09); --line2:rgba(255,238,220,.18);
  --ink:#f6f1ea; --ink2:#d9d1c7; --mute:#a0978d;
  --acc:#f2682a; --acct:#ff9b5e; --tan:#e5bb8f; --onacc:#170b05; --moss:#9cc8a6;
  --glass:rgba(18,16,15,.72);
  --h1a:#ffffff; --h1b:#a39a90; --ita:#ffe6cf; --itb:#e1a06b;
  --act-bg:#f6f1ea; --act-ink:#0a0908;
  --glow-a:rgba(242,104,42,.19); --glow-b:rgba(242,104,42,.075); --glow-c:rgba(242,104,42,.026); --grain-blend:overlay; --grain-op:.24;
  --sans:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style","Times New Roman",serif;
  --pad:28px; --r:28px;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
html[data-theme="light"]{
  --bg:#f3eee7; --herobg:#f8f4ee; --card:#fcfaf7; --card2:#ece4d9;
  --line:rgba(40,24,10,.11); --line2:rgba(40,24,10,.22);
  --ink:#16110d; --ink2:#3b322b; --mute:#6a6057;
  --acct:#b3380a; --tan:#96581f; --moss:#2c7443;
  --glass:rgba(252,250,247,.78);
  --h1a:#16110d; --h1b:#6a5a4c; --ita:#d4501a; --itb:#8f3410;
  --act-bg:#16110d; --act-ink:#fcfaf7;
  --glow-a:rgba(242,104,42,.16); --glow-b:rgba(242,104,42,.07); --glow-c:rgba(242,104,42,.024); --grain-blend:soft-light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{margin:0;font-weight:500;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
b,strong{font-weight:600}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--acct);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--pad)}

/* headline treatments */
.grad{color:var(--ink)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .grad{background:linear-gradient(180deg,var(--h1a) 18%,var(--h1b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding-bottom:.14em;margin-bottom:-.14em}
  .grad .it{background:linear-gradient(180deg,var(--ita),var(--itb));-webkit-background-clip:text;background-clip:text}
}
.it{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.1em;letter-spacing:-.015em;line-height:.92;padding:.04em .12em .16em 0}
.h2{font-size:clamp(2.3rem,5.4vw,4.3rem);letter-spacing:-.052em;line-height:1}

/* the bits everything is made of */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.num{font-size:15px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:0}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:5px 14px;border-radius:15px;border:1px solid var(--line2);font-size:13.5px;font-weight:500;line-height:1.2;color:var(--ink2)}
.orb{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--onacc);flex:none;padding:0;transition:transform .2s}
.pill{display:inline-flex;align-items:center;gap:16px;height:56px;padding:0 7px 0 26px;border-radius:99px;border:1px solid var(--line2);background:color-mix(in srgb,var(--card) 70%,transparent);color:var(--ink);font:500 16px/1 var(--sans);letter-spacing:-.01em;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s}
.pill:hover{border-color:color-mix(in srgb,var(--ink) 50%,transparent)}
.pill:hover .orb{transform:translateX(2px)}
.pill.pri{background:var(--act-bg);color:var(--act-ink);border-color:var(--act-bg)}
.pill.sm{height:46px;padding:0 6px 0 20px;gap:12px;font-size:15px}
.pill.sm .orb{width:34px;height:34px}
button.pill{font-family:var(--sans)}
button.pill[disabled]{opacity:.7;cursor:progress}
.badge{display:inline-flex;align-items:center;gap:10px;min-height:34px;padding:5px 16px;border:1px solid var(--line2);border-radius:99px;background:color-mix(in srgb,var(--card) 60%,transparent);font-size:14px;font-weight:500;color:var(--ink2)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.alert{display:flex;gap:14px;align-items:flex-start;padding:18px 22px;border-radius:22px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 7%,transparent);font-size:1.02rem;line-height:1.5}
.alert i{flex:none;width:9px;height:9px;margin-top:.55em;border-radius:50%;background:var(--acc)}
.bullets li{position:relative;padding:7px 0 7px 22px;font-size:16px;line-height:1.5;color:var(--ink2)}
.bullets li::before{content:"";position:absolute;left:0;top:1.1em;width:8px;height:8px;border-radius:50%;background:var(--acc)}

/* top bars */
.draft{border-bottom:1px solid var(--line);background:var(--herobg)}
.draft .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding-top:8px;padding-bottom:8px}
.nav{display:flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:99px;background:color-mix(in srgb,var(--card) 65%,transparent);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:500;color:var(--mute);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--ink) 13%,transparent);color:var(--ink)}
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.bar-in{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.02em;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 24%,transparent)}
.bar .nav{margin:0 auto}
.bar .pill{margin-left:auto}
.bar .nav + .pill{margin-left:0}

/* hero */
.hero{padding:10px 12px 0}
.heroin{--hpb:56px;position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line);border-radius:44px;padding:76px 0 var(--hpb);
  background:radial-gradient(90% 46% at 50% 0%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 72%),var(--herobg)}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center}
.intro .badge{margin-bottom:30px}
h1{font-size:clamp(2.5rem,6.2vw,5.1rem);letter-spacing:-.055em;line-height:.98}
.lede{max-width:36ch;margin:28px 0 0;font-size:clamp(1.05rem,1.6vw,1.28rem);line-height:1.5;color:var(--ink2);text-wrap:pretty}
.lede2{max-width:44ch;margin:12px 0 0;font-size:1rem;line-height:1.5;color:var(--mute);text-wrap:pretty}
.ctas{display:flex;flex-direction:column;align-items:center;gap:14px;margin:34px 0 8px}
.ctas .from{font-size:14.5px;color:var(--mute)}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.trust div{padding:24px 26px;border-left:1px solid var(--line)}
.trust div:first-child{border-left:0}
.trust b{display:block;font-size:clamp(1.8rem,3.2vw,2.6rem);font-weight:500;letter-spacing:-.055em;line-height:1}
.trust span{display:block;margin-top:8px;font-size:14px;color:var(--mute);line-height:1.35}
.trusted{display:inline-flex;align-items:center;gap:10px;min-height:36px;margin:0 0 30px;padding:6px 18px 6px 14px;border:1px solid var(--line2);border-radius:99px;background:color-mix(in srgb,var(--card) 60%,transparent);font-size:14.5px;font-weight:500;letter-spacing:-.01em;color:var(--ink2)}
.trusted::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--moss);flex:none}
.trusted b{font-weight:600;color:var(--ink)}
.trust.one{display:block;padding:24px;text-align:center;font-size:clamp(1.05rem,1.8vw,1.3rem);letter-spacing:-.02em;color:var(--ink2)}
.trust.one b{display:inline;font-size:1em;font-weight:500;letter-spacing:-.03em}
.glow{--gshape:ellipse 32% 58% at 50% 100%;position:absolute;left:50%;bottom:calc(var(--hpb) * -1 - 6px);width:1800px;height:640px;transform:translateX(-50%);pointer-events:none;z-index:-1;
  background:radial-gradient(var(--gshape),var(--glow-a) 0%,var(--glow-b) 30%,var(--glow-c) 58%,transparent 100%)}
.glow::after{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:200px 200px;mix-blend-mode:var(--grain-blend);opacity:var(--grain-op);
  -webkit-mask-image:radial-gradient(var(--gshape),#000 0%,transparent 100%);mask-image:radial-gradient(var(--gshape),#000 0%,transparent 100%)}

/* sections */
section.sec{padding:130px 0 0;scroll-margin-top:70px}
.shead{margin-bottom:48px;text-align:center}
.sub3{margin:64px 0 10px;text-align:center;font-size:1.5rem;letter-spacing:-.035em}

/* problem */
.statement{max-width:24em;margin:0 auto;text-align:center;font-size:clamp(1.3rem,2.4vw,1.85rem);font-weight:500;line-height:1.28;letter-spacing:-.03em;text-wrap:balance}
.statement .b{color:var(--ink)}
.statement .b{display:block}
.statement .m{display:block;max-width:33em;margin:14px auto 0;color:var(--mute);font-size:.72em;font-weight:400;line-height:1.5;letter-spacing:-.01em}
.statement .it{font-size:1.08em}
.statement + .statement{margin-top:64px}

/* proof */
.quotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.quote{display:flex;flex-direction:column;gap:26px;padding:32px}
.quote q{quotes:none;font-family:var(--sans);font-style:normal;font-size:clamp(1.05rem,1.5vw,1.2rem);line-height:1.55;letter-spacing:-.005em;color:var(--ink)}
.quote .who{margin-top:auto;display:flex;align-items:center;gap:14px}
.quote .nm{display:grid;gap:4px;min-width:0}
.avt{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--card2);border:1px solid var(--line2);color:var(--ink2);font-size:15px;font-weight:600;letter-spacing:.02em}
.avt img{width:100%;height:100%;object-fit:cover;display:block}
.quote .who b{font-size:16px}
.quote .who em{font-style:normal;font-size:14px;line-height:1.4;color:var(--mute)}
.rec{margin-top:16px;font-size:14.5px;color:var(--mute)}
.rec a{color:var(--acct)}
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pf{margin:0;padding:0;overflow:hidden}
.pf .bn{position:relative;aspect-ratio:4/1;background:var(--card2)}
.pf .bn.ph{background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--mute) 9%,transparent) 10px 20px);border-bottom:1.5px dashed var(--line2)}
.pf .bn img{width:100%;height:100%;object-fit:cover;display:block}
.pf .bn .tag{position:absolute;left:12px;top:12px;min-height:26px;padding:3px 12px;font-size:12px;background:var(--bg);color:var(--ink)}
.pf .meta{padding:0 22px 24px;display:grid;gap:9px}
.pf .av{width:58px;height:58px;border-radius:50%;background:var(--card2);border:3px solid var(--card);margin-top:-29px;position:relative}
.pf .ln{display:block;height:9px;border-radius:5px;background:var(--card2)}
.pf .ln.w1{width:42%}.pf .ln.w2{width:64%;opacity:.7}
.note{margin-top:14px;font-size:14px;color:var(--mute)}
.after{display:flex;justify-content:center;margin-top:48px}

/* benefits and steps */
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.bgrid .card{padding:30px 32px;min-height:170px}
.bgrid h3{font-size:1.5rem;letter-spacing:-.035em;margin-bottom:10px}
.ck{display:grid;place-items:center;width:34px;height:34px;margin-bottom:20px;border-radius:50%;border:1px solid var(--line2);color:var(--moss)}
.ck svg{width:17px;height:17px}
.bgrid p{color:var(--mute);font-size:1.02rem;line-height:1.5}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.st{display:flex;flex-direction:column;gap:12px;min-height:250px;padding:28px}
.st h3{margin-top:auto;font-size:1.4rem;letter-spacing:-.03em}
.st p{color:var(--mute);font-size:1rem;line-height:1.5}
.st .when{align-self:flex-start;margin-top:6px}
/* process: connected cards with small pictures */
.flow .st{position:relative;min-height:0}
.flow .st h3{margin-top:10px}
.flow .st .num{position:absolute;right:42px;top:40px;z-index:2;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);font-size:12px;color:var(--ink2)}
.flow .st:not(:last-child)::after{content:"\203A";position:absolute;right:-23px;top:88px;z-index:3;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);color:var(--ink2);font-size:18px;line-height:1;padding-bottom:2px}
.vz{position:relative;height:132px;margin-bottom:8px;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:radial-gradient(80% 90% at 50% 0%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 78%),var(--bg)}
.vz i{display:block}
.mf{position:absolute;left:14px;top:14px;width:152px;height:102px;display:grid;align-content:start;gap:7px;padding:12px;border-radius:14px;border:1px solid var(--line2);background:var(--card)}
.mf .b{height:14px;border-radius:8px;border:1px solid var(--line2)}
.mf .b.s{height:5px;width:34%;border:0;background:var(--ink);opacity:.3;border-radius:3px}
.mf .bt{height:16px;width:46%;border-radius:999px;background:var(--ink);opacity:.85;margin-top:2px}
.bub{position:absolute;right:16px;bottom:16px;display:flex;gap:5px;padding:12px 16px;border-radius:18px 18px 18px 4px;border:1px solid var(--line2);background:var(--card2)}
.bub i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.45}
.inv{position:absolute;left:14px;top:14px;width:142px;height:102px;display:grid;align-content:start;gap:8px;padding:13px;border-radius:14px;border:1px solid var(--line2);background:var(--card)}
.inv .h{height:8px;width:42%;border-radius:4px;background:var(--ink);opacity:.7}
.inv .r{height:5px;width:80%;border-radius:3px;background:var(--ink);opacity:.25}
.inv .r.s{width:55%}
.inv .paid{display:inline-flex;align-items:center;gap:5px;justify-self:start;margin-top:4px;padding:3px 10px 3px 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--moss) 55%,transparent);color:var(--moss);font-size:11.5px;font-weight:600}
.inv .paid svg{width:12px;height:12px}
.tile{position:absolute;width:46px;height:58px;padding:9px 8px;display:grid;align-content:start;gap:6px;border-radius:9px;border:1px solid var(--line2);background:var(--card2)}
.tile i{height:4px;border-radius:2px;background:var(--ink);opacity:.28}
.tile i + i{width:60%}
.tile.t1{right:86px;top:50px;transform:rotate(7deg)}
.tile.t2{right:34px;top:66px;transform:rotate(-6deg)}
.bb{position:absolute;aspect-ratio:4/1;border-radius:10px;border:1px solid var(--line2);overflow:hidden}
.bb .l1,.bb .l2,.bb .chip{position:absolute;border-radius:4px;background:var(--ink)}
.bb .l1{left:8%;top:34%;width:46%;height:12%;opacity:.75}
.bb .l2{left:8%;top:58%;width:30%;height:8%;opacity:.3}
.bb .chip{right:6%;top:14%;width:13%;height:18%;border-radius:999px;opacity:.2}
.bb.b0{left:14px;top:20px;width:236px;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--mute) 12%,transparent) 8px 16px),var(--card2);opacity:.55}
.bb.a1{left:34px;top:48px;width:252px;background:linear-gradient(105deg,color-mix(in srgb,var(--acc) 30%,var(--card)),var(--card2) 72%);box-shadow:0 14px 28px -14px rgba(0,0,0,.7)}
.vz .png{position:absolute;right:14px;bottom:12px;padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--moss) 55%,transparent);background:var(--bg);color:var(--moss);font-size:11px;font-weight:600;letter-spacing:.04em}
.stagehead{text-align:center;font-size:clamp(1.8rem,3.4vw,2.6rem);margin:0 0 28px}
.stages{list-style:none;display:grid;gap:14px;max-width:760px;margin:0 auto;padding:0;counter-reset:s}
.stg{display:flex;align-items:flex-start;gap:20px;padding:24px 28px}
.stg .sn{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);color:var(--ink2);font-size:15px;font-weight:500}
.stg h3{font-size:1.25rem;letter-spacing:-.03em;margin-bottom:6px}
.stg p{color:var(--mute);font-size:1rem;line-height:1.5}

/* the offer: dark see-through cards, orange gradient rising from the bottom, stronger down the line */
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.rung{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:14px;min-height:0;padding:30px}
.rung.hl{border-color:color-mix(in srgb,var(--acc) 70%,var(--line))}
.rung .pill{margin-top:10px;width:100%;justify-content:space-between}
.rung::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(to top,var(--og1) 0%,var(--og2) 55%,transparent 100%)}
.rung.r1{--og1:rgba(224,80,26,.62);--og2:rgba(224,80,26,.2)}
.rung.r2{--og1:rgba(255,138,69,.36);--og2:rgba(255,138,69,.11)}
.rung.r3{--og1:rgba(255,182,131,.2);--og2:rgba(255,182,131,.06)}
.rung .name{font-size:1.4rem;letter-spacing:-.03em;font-weight:500;color:var(--ink)}
.rung .price{margin-top:34px;font-size:clamp(3.6rem,5.4vw,5rem);letter-spacing:-.065em;line-height:.95;font-weight:500}
.rung .price small{margin-left:10px;font-size:.26em;font-weight:500;letter-spacing:-.01em;-webkit-text-fill-color:currentColor;color:var(--mute)}
.rung .d{color:var(--ink2);font-size:1rem;line-height:1.5;min-height:3em}
.rung .bullets{flex:1;padding-top:10px;border-top:1px solid var(--line)}
.offernote{display:grid;gap:14px;margin-top:18px}
.offernote .incl{padding:0 6px;color:var(--mute);font-size:15.5px}

/* about */
.aboutcard{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:center;padding:30px}
.aboutcard .pho{aspect-ratio:1;border-radius:22px;overflow:hidden;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.aboutcard .pho img{width:100%;height:100%;object-fit:cover;display:block}
.aboutcard .pho .mono{font-family:var(--serif);font-style:italic;font-size:4.2rem;color:var(--tan)}
.aboutcard p{margin-top:16px;font-size:1.12rem;line-height:1.55;color:var(--ink2);max-width:52ch}

/* questions */
.faqlist{max-width:820px;margin:0 auto}
.faqlist details{margin-bottom:14px;padding:0;overflow:hidden}
.faqlist summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px 20px 28px;cursor:pointer;list-style:none;font-size:1.25rem;font-weight:500;letter-spacing:-.03em;line-height:1.2}
.faqlist summary::-webkit-details-marker{display:none}
.pm{position:relative;width:38px;height:38px;border-radius:50%;background:var(--acc);flex:none;transition:transform .25s}
.pm::before,.pm::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;border-radius:2px;background:var(--onacc);transform:translate(-50%,-50%)}
.pm::after{transform:translate(-50%,-50%) rotate(90deg)}
details[open] .pm{transform:rotate(45deg)}
.faqlist p{padding:0 28px 26px;color:var(--mute);font-size:1.02rem;line-height:1.55;max-width:60ch}

/* sliding rails: reviews and flipping banners */
.rail{-webkit-user-select:none;user-select:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.rail::-webkit-scrollbar{display:none}
.rail.drag{cursor:grabbing;user-select:none;-webkit-user-select:none}
.rail:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:20px}
.track{display:flex;gap:18px;width:max-content;padding:6px 0}
.rail .quote{flex:none;width:min(86vw,390px)}
.railfoot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px}
.railfoot .rec{margin:0}
.railfoot.center{justify-content:center}
.sub2{margin:110px 0 40px}
.note-inline{display:block;margin-top:4px;opacity:.8}
.railctl{display:flex;gap:10px;flex:none}
.rbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink);font:400 24px/1 var(--sans);padding:0 0 3px;cursor:pointer;transition:border-color .2s,transform .2s}
.rbtn:hover{border-color:var(--acc)}
.rbtn:active{transform:scale(.94)}
.rbtn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
/* coverflow: one banner in focus, the rest at the sides */
.cf{--w:min(88vw,860px);position:relative;touch-action:pan-y;outline:none;-webkit-user-select:none;user-select:none}
.cf:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:20px}
.cfstage{position:relative;height:calc(var(--w) / 4 + 112px);overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(180deg,transparent,#000 12%,#000 78%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(180deg,transparent,#000 12%,#000 78%,transparent);mask-composite:intersect}
.fcard{position:absolute;left:50%;top:0;width:var(--w);margin-left:calc(var(--w) / -2);padding:50px 12px 0;transform-origin:50% 50%;
  transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .8s ease;will-change:transform}
.fcard[data-pos="0"]{transform:none;opacity:1;z-index:3}
.fcard[data-pos="-1"]{transform:translateX(calc(var(--w) * -.8 - 28px)) scale(.64);opacity:.4;z-index:2;cursor:pointer}
.fcard[data-pos="1"]{transform:translateX(calc(var(--w) * .8 + 28px)) scale(.64);opacity:.4;z-index:2;cursor:pointer}
.fcard[data-pos="-2"]{transform:translateX(calc(var(--w) * -1.1)) scale(.45);opacity:0;pointer-events:none;z-index:1}
.fcard[data-pos="2"]{transform:translateX(calc(var(--w) * 1.1)) scale(.45);opacity:0;pointer-events:none;z-index:1}
.fcard:not([data-pos="0"]) .flip{pointer-events:none}
@media (max-width:600px){
  .cf{--w:82vw}
  .fcard[data-pos="-1"]{transform:translateX(calc(var(--w) * -.62 - 4px)) scale(.62)}
  .fcard[data-pos="1"]{transform:translateX(calc(var(--w) * .62 + 4px)) scale(.62)}
}
.tapnote{margin:2px 0 0;text-align:center;font-size:14.5px;color:var(--mute)}
.cfnav{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:16px}
.dots{display:flex;justify-content:center;gap:10px}
.dot{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line2);cursor:pointer;transition:background .2s,transform .2s}
.dot[aria-current="true"]{background:var(--acc);transform:scale(1.25)}
.dot:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.dot{position:relative}
.dot::after{content:"";position:absolute;inset:-12px -6px}   /* bigger tap area, same look */
.flip{display:block;position:relative;width:100%;padding:0;border:0;background:none;cursor:pointer;perspective:1400px;font:inherit;color:inherit;text-align:left}
.flip:focus-visible{outline:2px solid var(--acc);outline-offset:8px;border-radius:18px}
.fl{display:block;position:relative;z-index:1;transform-style:preserve-3d;animation:bob 6s ease-in-out infinite}
/* the After side gets a copper glow behind it */
.flip::before{content:"";position:absolute;z-index:0;inset:-12% -2% -14%;border-radius:48px;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .9s ease,transform .9s cubic-bezier(.3,.7,.2,1);
  background:radial-gradient(60% 75% at 50% 55%,color-mix(in srgb,var(--acc) 70%,transparent),color-mix(in srgb,var(--acc) 34%,transparent) 62%,transparent 86%);filter:blur(26px)}
.flip.on::before{opacity:1;transform:scale(1);animation:glow 3.6s ease-in-out .9s infinite}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
[data-theme="light"] .flip.on::before{opacity:.75}

/* hold and drag the front banner: it follows your finger, then springs back */

.face img{-webkit-user-drag:none;user-select:none}
.face{position:absolute;inset:0;display:block;overflow:hidden;border-radius:14px;border:1px solid var(--line2);background:var(--card2);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 22px 44px -20px rgba(0,0,0,.75)}

.face .phtext{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:14px}

.sh{display:block;width:72%;height:16px;margin:30px auto 0;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);filter:blur(5px);animation:bobsh 6s ease-in-out infinite}

@keyframes bob{0%,100%{transform:translateY(0) rotateX(3deg) rotateY(-4deg)}50%{transform:translateY(-12px) rotateX(-2deg) rotateY(4deg)}}
@keyframes bobsh{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(.8);opacity:.4}}
[data-theme="light"] .face{box-shadow:0 22px 40px -22px rgba(70,40,15,.45)}

@media (prefers-reduced-motion:reduce){.fl,.sh,.flip.on::before{animation:none}.flipper{transition-duration:.01s}}

/* benefits: one big card and four small ones */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.bx{position:relative;overflow:hidden;isolation:isolate;padding:32px;display:flex;flex-direction:column}

.mini{margin-top:26px;border:1px solid var(--line2);border-radius:18px;background:var(--bg);overflow:hidden;max-width:520px}
.mini .mb{position:relative;aspect-ratio:4/1;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:0 24px;background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card2))}
.mini .l1{display:block;width:58%;height:12px;border-radius:6px;background:var(--ink);opacity:.85}

/* a la carte menu inside the pricing card */
.menu{display:grid;gap:10px;margin-top:2px}

/* faint banners drifting behind the hero */
.floaters{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;perspective:1300px;
  -webkit-mask-image:radial-gradient(ellipse 52% 62% at 50% 46%,transparent 30%,#000 86%);mask-image:radial-gradient(ellipse 52% 62% at 50% 46%,transparent 30%,#000 86%);
  animation:fbin 3.2s ease-out both}
.fb{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:4/1;transform-style:preserve-3d;
  filter:blur(var(--bl));opacity:var(--o);

.fbi{position:absolute;inset:0;display:block;overflow:hidden;border-radius:14px;border:1px solid color-mix(in srgb,var(--tan) 28%,transparent);

@keyframes fbdrift{
  0%,100%{transform:translate3d(0,0,0) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz))}
  50%{transform:translate3d(var(--dx),var(--dy),0) rotateX(calc(var(--rx) * -.5)) rotateY(calc(var(--ry) * -.6)) rotateZ(calc(var(--rz) * .4))}
}
@keyframes fbin{from{opacity:0}to{opacity:1}}
@media (max-width:900px){.fb:nth-child(n+4){display:none}.floaters{-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 38%,#000 92%);mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 38%,#000 92%)}}

.ivtab th{padding:16px 0 12px;font-size:13px;font-weight:500;color:var(--imute);text-align:right;border-bottom:1px solid var(--iline)}
.ivtab th:first-child,.ivtab td:first-child{padding-left:22px}
.ivtab th:last-child,.ivtab td:last-child{padding-right:22px}
.ivtab th.d,.ivtab td.d{text-align:left}
.ivtab td{padding:15px 0;border-bottom:1px solid var(--iline);text-align:right;color:var(--imute)}
.ivtab tr:last-child td{border-bottom:0}
.ivtab td.d{color:var(--iink);padding-right:12px}
.ivtab td.a{color:var(--iink)}
.ivtab td.q{text-align:center}
.ivsum{margin:22px 0 0 auto;width:min(100%,340px);padding:0 4px}
.ivsum div{display:flex;justify-content:space-between;padding:6px 0;font-size:1.02rem;color:var(--imute)}
.ivsum dd{margin:0;color:var(--iink)}
.ivsum .tot{margin-top:12px;padding-top:16px;border-top:1px solid var(--iline2);align-items:baseline}
.ivsum .tot dt{font-weight:600;color:var(--iink)}
.ivsum .tot dd{font-size:2rem;font-weight:600;letter-spacing:-.03em}
.ivrem{margin-top:clamp(26px,6vw,40px);padding:18px 22px;border:1px solid var(--iline);border-radius:20px}
.ivrem p{margin:10px 0 0;font-size:14.5px;line-height:1.55;color:var(--imute)}
.ivrem b{font-weight:600;color:var(--iink2)}
.ivthx{margin:clamp(26px,6vw,40px) 0 0;font:italic 400 1.7rem/1.1 var(--serif);color:var(--itan)}
.ivli{display:flex;align-items:center;gap:8px;margin:16px 0 0;font-size:13.5px;color:var(--imute)}
.ivli .in{display:grid;place-items:center;width:15px;height:15px;border-radius:3px;background:var(--imute);color:var(--ibg);font-size:9px;font-weight:700}
.dlrow{margin-top:26px}
@media (max-width:640px){
  .ivmeta{grid-template-columns:1fr}
  .ivmeta>div+div{border-left:0;border-top:1px solid var(--iline)}
  .ivtab{font-size:14px}
  .ivtab th{font-size:11.5px;white-space:nowrap}
  .ivtab th,.ivtab td{padding-left:4px}
  .ivtab th:first-child,.ivtab td:first-child{padding-left:16px}
  .ivtab th:last-child,.ivtab td:last-child{padding-right:16px}
  .ivtop{flex-wrap:wrap}
}

.brand .by{font-style:normal;font-weight:300;color:var(--ink2)}

/* ---------- liquid glass buttons ----------
   A clear, slightly frosted pill: a bright thin rim on the top and left, a soft inner shine,
   a gentle shadow under it and a light sweep on hover. The main button is a brighter frosted white. */
:root{
  --gl-fill:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 60%,rgba(255,255,255,.08));
  --gl-rim:rgba(255,255,255,.16);
  --gl-shadow:0 14px 28px -14px rgba(0,0,0,.75),0 2px 5px rgba(0,0,0,.28);
  --gl-inset:inset 0 1.5px 0 rgba(255,255,255,.5),inset 1.5px 0 1px -1px rgba(255,255,255,.34),inset 0 -1.5px 1px -1px rgba(255,255,255,.22),inset -1.5px 0 1px -1px rgba(255,255,255,.16);
  --gp-fill:linear-gradient(180deg,rgba(255,255,255,.96),rgba(238,231,222,.8));
  --gp-ink:#0a0908;
  --gp-shadow:0 16px 32px -14px rgba(0,0,0,.8),0 2px 6px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08);
  --gp-inset:inset 0 2px 0 #fff,inset 1.5px 0 1px -1px rgba(255,255,255,.9),inset 0 -3px 5px -2px rgba(120,96,70,.28),inset -1.5px 0 1px -1px rgba(255,255,255,.5);
}
html[data-theme="light"]{
  --gl-fill:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.34) 60%,rgba(255,255,255,.5));
  --gl-rim:rgba(255,255,255,.9);
  --gl-shadow:0 14px 26px -14px rgba(70,40,15,.42),0 2px 5px rgba(70,40,15,.12);
  --gl-inset:inset 0 1.5px 0 #fff,inset 1.5px 0 1px -1px rgba(255,255,255,.95),inset 0 -1.5px 1px -1px rgba(70,40,15,.12),inset -1.5px 0 1px -1px rgba(70,40,15,.08);
  --gp-fill:linear-gradient(180deg,rgba(255,255,255,.95),rgba(236,229,220,.7));
  --gp-ink:#16110d;
  --gp-shadow:0 16px 30px -14px rgba(70,40,15,.5),0 2px 5px rgba(70,40,15,.16);
  --gp-inset:inset 0 2px 0 #fff,inset 1.5px 0 1px -1px #fff,inset 0 -3px 5px -2px rgba(120,96,70,.2),inset -1.5px 0 1px -1px rgba(255,255,255,.7);
}
.pill,.rbtn,.nav{
  background:var(--gl-fill);
  -webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);
  border:1px solid var(--gl-rim);
  box-shadow:var(--gl-inset),var(--gl-shadow);
}
.pill{position:relative;overflow:hidden;isolation:isolate;transition:transform .25s cubic-bezier(.3,.9,.3,1.2),box-shadow .25s,background .25s}
/* the shine across the top half */
.pill::before{content:"";position:absolute;z-index:-1;left:3px;right:3px;top:2px;height:46%;border-radius:99px 99px 50% 50% / 99px 99px 38% 38%;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));pointer-events:none}
/* the light sweep on hover */
.pill::after{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:-60%;width:46%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);pointer-events:none;transition:left .8s ease}
.pill:hover{border-color:var(--gl-rim);transform:translateY(-1px)}
.pill:hover::after{left:120%}
.pill:active{transform:translateY(0) scale(.985)}
.pill.pri{background:var(--gp-fill);color:var(--gp-ink);border-color:rgba(255,255,255,.7);box-shadow:var(--gp-inset),var(--gp-shadow)}
.pill.pri::before{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
.pill.pri::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}
html[data-theme="light"] .pill.pri{border-color:rgba(255,255,255,.95)}
.pill.ask{background:var(--gl-fill);border-color:var(--gl-rim);color:var(--ink)}
.pill.ask:hover{background:var(--gl-fill);color:var(--ink)}
/* the orange circle stays the "press me" mark, now a little glossy */
.orb{background:linear-gradient(180deg,#f9783a,#e85a1c);color:#fff;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 3px rgba(120,30,0,.32),0 5px 11px -4px rgba(242,104,42,.65)}
.orb svg{width:42%;height:42%;display:block}
.pill:hover .orb{transform:translateX(3px)}
.rbtn{transition:transform .25s cubic-bezier(.3,.9,.3,1.2),box-shadow .25s}
.rbtn:hover{border-color:var(--gl-rim);transform:translateY(-1px)}
.nav{background:var(--gl-fill);border-color:var(--gl-rim)}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--ink) 14%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
@media (prefers-reduced-motion:reduce){.pill::after{display:none}.pill,.rbtn{transition:none}}

/* the top-bar links sit as plain text, no bubble around them */
.bar .nav{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;gap:6px}

/* ============================================================
   Round 42: every section gets its own shape.
   hero blueprint, three weak banners, a ruled list beside a drawing,
   a Featured band, big quotes, a timeline. Cards stay for pricing and FAQs.
   ============================================================ */
.sublede{max-width:44ch;margin:18px auto 0;color:var(--mute);font-size:1.08rem;line-height:1.5;text-wrap:pretty}
.hero h1{font-size:clamp(2.35rem,5.5vw,4.6rem)}
.hero h1 .hl{display:block;text-wrap:balance}
.hero .lede{max-width:46ch;text-wrap:balance}
/* an italic phrase in the middle of a headline: pull the next word back in (the padding is there so the italic tail isn't cut) */
h1 .it,.h2 .it{margin-right:-.07em}
.pin{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--tan);color:var(--tan);font:500 12px/1 var(--sans);font-style:normal;flex:none}

/* 1. hero: a profile card with a banner blueprint */
.bp{margin:56px auto 0;max-width:860px}
.bpcard{border:1px solid var(--line2);border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:0 44px 80px -44px rgba(0,0,0,.85)}
.bpban{position:relative;aspect-ratio:4/1;background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 34%,var(--card)),var(--card2) 80%)}
.bpban img{width:100%;height:100%;object-fit:cover;display:block}
.bpl,.bprow,.bpbtn{position:absolute;display:block}
.bpl{background:var(--ink)}
.bpl.b1{left:30%;top:20%;width:20%;height:8%;border-radius:99px;opacity:.45}
.bpl.b2{left:30%;top:36%;width:38%;height:18%;border-radius:8px;opacity:.92}
.bprow{left:30%;top:66%;width:30%;height:14%;display:flex;gap:3%}
.bprow i{flex:1;border-radius:99px;border:1px solid color-mix(in srgb,var(--ink) 50%,transparent)}
.bpbtn{right:6%;top:36%;width:15%;height:24%;border-radius:99px;background:var(--ink);opacity:.92}
.bpban .pin{position:absolute;transform:translate(-50%,-50%);box-shadow:0 4px 10px -4px rgba(0,0,0,.6)}
.bpban .p1{left:53%;top:24%}
.bpban .p2{left:71%;top:45%}
.bpban .p3{left:63%;top:73%}
.bpban .p4{left:93.5%;top:36%}
.bpmeta{position:relative;display:grid;gap:10px;padding:0 3.5% 22px}
.bpmeta .av{width:19%;aspect-ratio:1;border-radius:50%;background:var(--card2);border:4px solid var(--bg);margin-top:-11.5%}
.bpmeta .ln{display:block;height:10px;border-radius:5px;background:var(--card2)}
.bpmeta .ln.w1{width:30%}
.bpmeta .ln.w2{width:48%;opacity:.7}
.bpact{display:flex;gap:8px;margin-top:6px}
.bpact i{display:block;width:92px;height:28px;border-radius:99px;border:1px solid var(--line2)}
.bpact i:first-child{background:var(--card2)}
.bp figcaption{margin-top:28px}
.bpcap{margin-bottom:18px;text-align:center;color:var(--ink2);font-size:1.02rem;font-weight:500;letter-spacing:-.01em}
.bpkey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;text-align:left}
.bpkey li{display:flex;gap:10px;align-items:flex-start}
.bpkey b{display:block;font-size:15.5px;font-weight:500;color:var(--ink);line-height:1.3}
.bpkey em{display:block;margin-top:2px;font-style:normal;font-size:13.5px;line-height:1.4;color:var(--mute)}
.bpkey.nopin .pin{display:none}

/* 2. problem: the question on the left, three banners most profiles have on the right */
.tst{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:64px;align-items:center}
.tst .h2{font-size:clamp(2rem,4.3vw,3.5rem);line-height:1.04;text-align:left}
.weak{display:grid;gap:16px}
.weak li{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:center}
.wb{position:relative;display:block;aspect-ratio:4/1;border-radius:10px;border:1px solid var(--line2);overflow:hidden}
.wb.blank{background:linear-gradient(120deg,#3f4a50,#5a666c)}
.wb.skyline{background:linear-gradient(180deg,#24354a,#51688a)}
.wb.skyline svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:72%;fill:#0f1822;opacity:.88}
.wb.vague{background:radial-gradient(60% 130% at 18% 30%,#7b52b3,transparent 70%),radial-gradient(60% 130% at 84% 70%,#2f82b8,transparent 70%),#2a2142}
.wb .vt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:clamp(12px,1.5vw,18px);color:rgba(255,255,255,.88)}
.wc b{display:block;font-size:1.08rem;font-weight:500;letter-spacing:-.02em;line-height:1.25}
.wc em{display:block;margin-top:3px;font-style:normal;color:var(--mute);font-size:.98rem;line-height:1.4}
.tst + .statement{margin-top:96px}

/* 4. what you get: a ruled list beside the pieces */
.inc{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);column-gap:64px;row-gap:36px}
.inchead{grid-column:1;grid-row:1}
.incbody{grid-column:1;grid-row:2}
.stackwrap{grid-column:2;grid-row:1 / span 2}
.inchead .h2{text-align:left}
.inchead .sublede{margin-left:0}
.incl{border-top:1px solid var(--line)}
.incl li{display:flex;gap:18px;align-items:flex-start;padding:20px 0;border-bottom:1px solid var(--line)}
.incl .ck{width:30px;height:30px;margin:1px 0 0;flex:none}
.incl .ck svg{width:15px;height:15px}
.incl b{display:block;font-size:1.22rem;font-weight:500;letter-spacing:-.03em;line-height:1.2}
.incl p{margin-top:5px;color:var(--mute);font-size:1rem;line-height:1.5}
.incta{margin-top:36px}
.stack{position:sticky;top:92px;aspect-ratio:1/1.04;border:1px solid var(--line);border-radius:36px;overflow:hidden;
  background:radial-gradient(80% 60% at 70% 100%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 72%),var(--herobg)}
.sb{position:absolute;display:block;width:72%;aspect-ratio:4/1;border-radius:11px;border:1px solid var(--line2);overflow:hidden;background:var(--card2)}
.sb i{position:absolute;display:block;border-radius:5px;background:var(--ink)}
.sb .l1{left:8%;top:32%;width:44%;height:13%;opacity:.75}
.sb .l2{left:8%;top:57%;width:28%;height:9%;opacity:.3}
.sb b{position:absolute;right:4%;top:14%;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);font-size:12px;font-weight:500;color:var(--ink2)}
.sb.s1{left:9%;top:10%;transform:rotate(-5deg);opacity:.6}
.sb.s2{left:14%;top:22%;transform:rotate(2.5deg);opacity:.8;background:linear-gradient(105deg,color-mix(in srgb,var(--tan) 16%,var(--card)),var(--card2))}
.sb.s3{left:19%;top:35%;transform:rotate(-1.5deg);background:linear-gradient(105deg,color-mix(in srgb,var(--acc) 36%,var(--card)),var(--card2) 76%);border-color:color-mix(in srgb,var(--acc) 60%,var(--line));box-shadow:0 22px 40px -18px rgba(0,0,0,.75)}
.gl{position:absolute;left:9%;top:60%;width:47%;height:29%;display:grid;align-content:start;gap:9%;padding:5%;border-radius:16px;border:1px solid var(--line2);background:var(--card)}
.gl .sw{display:flex;gap:8px}
.gl .sw i{display:block;width:17%;aspect-ratio:1;border-radius:50%;background:var(--acc)}
.gl .sw i:nth-child(2){background:var(--tan)}
.gl .sw i:nth-child(3){background:var(--ink)}
.gl .aa{font:italic 400 clamp(1.5rem,3vw,2.3rem)/1 var(--serif);color:var(--ink)}
.gl .ln{display:block;height:6px;width:76%;border-radius:3px;background:var(--ink);opacity:.25}
.gl .ln.s{width:48%}
.chipx{position:absolute;display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:99px;border:1px solid color-mix(in srgb,var(--moss) 55%,transparent);background:var(--bg);color:var(--moss);font-size:13px;font-weight:600}
.chipx svg{width:13px;height:13px}
.chipx.png{right:10%;top:63%;letter-spacing:.04em}
.chipx.hrs{right:16%;top:77%}

/* 5. Featured thumbnails: a band with two versions of the same row */
.band{position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line);border-radius:44px;padding:88px 56px 60px;
  background:radial-gradient(70% 50% at 50% 100%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 72%),var(--herobg)}
.bandhead{text-align:center}
.bandhead .h2{max-width:15em;margin:0 auto;font-size:clamp(2rem,4.4vw,3.5rem);line-height:1.04}
.bandhead .sublede{max-width:50ch}
.ftduo{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:900px;margin:52px auto 0}
.ftduo figure{margin:0}
.ftbox{display:block;padding:18px 18px 20px;border:1px solid var(--line2);border-radius:20px;background:var(--bg)}
.ftbox.on{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.ftbox em{display:block;margin-bottom:12px;font-style:normal;font-weight:500;font-size:14px;color:var(--ink2)}
.ftrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ftrow i{position:relative;display:block;aspect-ratio:1.6/1;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.ftbox.off .t1{background:#e8ecf1}
.ftbox.off .t1::before{content:"";position:absolute;left:0;right:0;top:0;height:40%;background:#3b6fd1}
.ftbox.off .t1::after{content:"";position:absolute;left:10%;top:58%;width:54%;height:11%;border-radius:3px;background:#8c96a3}
.ftbox.off .t2{background:linear-gradient(135deg,#2c7a58,#a3d490)}
.ftbox.off .t2::after{content:"";position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.75);transform:translate(-50%,-50%)}
.ftbox.off .t3{background:#2a2a2d}
.ftbox.off .t3::before{content:"";position:absolute;left:10%;top:30%;width:60%;height:12%;border-radius:3px;background:#77777c}
.ftbox.off .t3::after{content:"";position:absolute;left:10%;top:54%;width:36%;height:12%;border-radius:3px;background:#55555a}
.ftbox.on i{background:linear-gradient(105deg,color-mix(in srgb,var(--acc) 36%,var(--card)),var(--card2) 78%);border-color:color-mix(in srgb,var(--tan) 30%,transparent)}
.ftbox.on i::before{content:"";position:absolute;left:10%;top:34%;width:54%;height:14%;border-radius:4px;background:var(--ink);opacity:.88}
.ftbox.on i::after{content:"";position:absolute;left:10%;top:60%;width:28%;height:16%;border-radius:99px;background:var(--ink);opacity:.4}
.ftduo figcaption{margin-top:14px;padding:0 4px}
.ftduo figcaption b{display:block;font-weight:500;font-size:1.08rem;letter-spacing:-.02em}
.ftduo figcaption span{display:block;margin-top:2px;color:var(--mute);font-size:.98rem;line-height:1.4}
.ftprice{margin-top:46px;text-align:center;color:var(--ink2);font-size:1.05rem}
.ftprice a{color:var(--acct);text-underline-offset:3px;white-space:nowrap}

/* 6. reviews as big quotes (three or fewer), then the about card with three facts */
.qduo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:1060px;margin:0 auto}
.qduo.n1{grid-template-columns:minmax(0,1fr);max-width:640px}
.qduo.n3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:none}
.bigq{margin:0;padding:6px 44px;display:flex;flex-direction:column;gap:26px}
.bigq + .bigq{border-left:1px solid var(--line)}
.bigq::before{content:"\201C";display:block;height:.42em;font:italic 400 5.2rem/1 var(--serif);color:var(--tan)}
.bigq q{quotes:none;font-size:clamp(1.15rem,1.9vw,1.45rem);line-height:1.45;letter-spacing:-.015em;color:var(--ink)}
.bigq .who{margin-top:auto;display:flex;align-items:center;gap:14px}
.bigq .nm{display:grid;gap:4px;min-width:0}
.bigq .who b{font-size:16px}
.bigq .who em{font-style:normal;font-size:14px;line-height:1.4;color:var(--mute)}
.recall{margin-top:36px;text-align:center}
.recall a{color:var(--acct);text-underline-offset:3px}
#proof .aboutcard{margin-top:84px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:26px;border-top:1px solid var(--line)}
.facts div{padding:18px 16px 0 0}
.facts div + div{padding-left:18px;border-left:1px solid var(--line)}
.facts b{display:block;font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:500;letter-spacing:-.045em;line-height:1}
.facts span{display:block;margin-top:7px;font-size:14px;color:var(--mute);line-height:1.35}

/* 7. how it works: a timeline. The ring marks a stop (tan, since orange circles mean "press me"). */
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px}
.tl .vz{margin-bottom:0}
.tlrow{display:flex;align-items:center;gap:14px;margin:26px 0 18px}
.tlrow i{display:block;width:11px;height:11px;border-radius:50%;border:2px solid var(--tan);flex:none}
.tlrow::after{content:"";flex:1;height:1px;margin-right:-28px;background:var(--line2)}
.tl li:last-child .tlrow::after{margin-right:0;background:linear-gradient(90deg,var(--line2),transparent)}
.tltime{font:italic 400 clamp(2.1rem,3.5vw,3rem)/1 var(--serif);color:var(--tan);white-space:nowrap}
.tl h3{font-size:1.4rem;letter-spacing:-.03em}
.tl p{margin-top:10px;max-width:34ch;color:var(--mute);font-size:1rem;line-height:1.5}

/* 8. pricing: the small label on a card, and the days left on the promo line */
/* the label sits on the top edge of its card, like a tab */
.rung::before{border-radius:inherit}
.rung.hl{overflow:visible}
.ptag{position:absolute;z-index:2;left:28px;top:-14px;display:inline-flex;align-items:center;min-height:28px;padding:3px 13px;border-radius:99px;border:1px solid color-mix(in srgb,var(--acc) 70%,var(--line));background:var(--bg);font-size:13px;font-weight:500;color:var(--ink)}
.alert .left{flex:none;align-self:center;margin-left:auto;padding:4px 13px;border-radius:99px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);font-size:13.5px;font-weight:500;white-space:nowrap}

@media (max-width:900px){
  .bp{margin-top:42px}
  .tst{grid-template-columns:minmax(0,1fr);gap:36px}
  .tst .h2{text-align:center}
  .tst + .statement{margin-top:64px}
  .inc{grid-template-columns:minmax(0,1fr);row-gap:34px}
  .inchead,.incbody,.stackwrap{grid-column:1;grid-row:auto}
  .inchead .h2{text-align:center}
  .inchead .sublede{margin-left:auto;text-align:center}
  .incta{display:flex;justify-content:center}
  .stack{position:relative;top:auto;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1/.9;border-radius:28px}
  .band{border-radius:34px;padding:60px 20px 44px}
  .ftduo{grid-template-columns:minmax(0,1fr);gap:28px;margin-top:38px}
  .qduo,.qduo.n3{grid-template-columns:minmax(0,1fr)}
  .bigq{padding:6px 4px}
  .bigq + .bigq{border-left:0;border-top:1px solid var(--line);margin-top:36px;padding-top:42px}
  #proof .aboutcard{margin-top:64px}
  .tl{grid-template-columns:minmax(0,1fr);gap:48px}
  .tlrow::after{margin-right:0;background:linear-gradient(90deg,var(--line2),transparent)}
  .tl p{max-width:none}
}
@media (max-width:700px){
  .bpcard{border-radius:16px}
  .bpkey{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
  .pin{width:18px;height:18px;font-size:10.5px}
  .bpmeta{gap:7px;padding-bottom:16px}
  .bpmeta .ln{height:7px}
  .bpmeta .av{border-width:3px}
  .bpact i{width:64px;height:22px}
  .weak li{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
  .wc b{font-size:1rem}
  .wc em{font-size:.92rem}
  .alert{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:12px}
  .alert .left{grid-column:2;justify-self:start;margin-left:0}
  .facts{grid-template-columns:minmax(0,1fr);border-top:0;margin-top:20px}
  .facts div,.facts div + div{display:flex;align-items:baseline;gap:12px;padding:13px 0;border-left:0;border-top:1px solid var(--line)}
  .facts b{flex:none;min-width:4.2rem;font-size:1.4rem}
  .facts span{margin-top:0;font-size:15px}
}
</style>
