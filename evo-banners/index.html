<script>
/* Shared helpers. Reads everything from the FUNNEL config at the top of the page. */
var ORB = '<span class="orb" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></span>';
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* *words* become the italic serif accent, newline becomes <br> */
function rich(s){ return esc(s).replace(/\*([^*]+)\*/g, '<span class="it">$1</span>').replace(/\n/g, '<br>'); }
function $(sel, root){ return (root || document).querySelector(sel); }
function pill(label, href, cls, extra){ return '<a class="pill ' + (cls || 'pri') + '" href="' + esc(href) + '"' + (extra || '') + '><span>' + esc(label) + '</span>' + ORB + '</a>'; }

function currentLook(){
  var q = ''; try { q = new URLSearchParams(location.search).get('look'); } catch(e){}
  if (q === 'light' || q === 'dark') return q;
  return FUNNEL.look === 'light' ? 'light' : 'dark';
}

function applyTheme(){
  var look = currentLook(), root = document.documentElement;
  root.setAttribute('data-theme', look);
  var a = FUNNEL.colors && FUNNEL.colors.accent;
  if (a && a.toLowerCase() !== '#f2682a') root.style.setProperty('--acc', a);
  var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', look === 'light' ? '#f3eee7' : '#0a0908');
}

/* The top of every page: an optional draft strip with a page switcher, then the sticky bar. */
/* "Evo Banners by Justin": the "by Justin" part is set thin */
/* a la carte discount: tiers = [[pieces, percent], ...]. Returns the percent now and the next step up (or null). */
function discountFor(tiers, pieces){
  var pct = 0, next = null;
  (tiers || []).forEach(function(t){ if (pieces >= t[0]) pct = t[1]; else if (!next) next = { min: t[0], pct: t[1] }; });
  return { pct: pct, next: next };
}

function brandHtml(name){
  var m = String(name).match(/^(.*?)(\s+by\s+.+)$/i);
  return m ? esc(m[1]) + '<em class="by">' + esc(m[2]) + '</em>' : esc(name);
}
function renderBar(current){
  var d = FUNNEL.draftBadge, html = '';
  if (d && d.show) {
    var pages = [['index.html', 'landing', 'Landing'], ['order.html', 'order', 'Design form'], ['thank-you.html', 'thanks', 'Pay'], ['paid.html', 'paid', 'Paid']];
    html += '<div class="draft"><div class="wrap"><span class="badge"><i></i><span>' + esc(d.text) + '</span></span><nav class="nav" aria-label="Draft pages">' +
      pages.map(function(p){ return '<a href="' + p[0] + '"' + (p[1] === current ? ' aria-current="page"' : '') + '>' + p[2] + '</a>'; }).join('') + '</nav></div></div>';
  }
  var onLanding = current === 'landing';
  var onOrder = current === 'order';
  var brand = onLanding ? '<a class="brand" href="#top" aria-label="Back to the top"><span>' + brandHtml(FUNNEL.brand.name) + '</span></a>'
    : onOrder ? '<a class="brand" href="index.html" aria-label="Back to the home page"><span>' + brandHtml(FUNNEL.brand.name) + '</span></a>'
    : '<span class="brand"><span>' + brandHtml(FUNNEL.brand.name) + '</span></span>';
  html += '<header class="bar"><div class="wrap bar-in">' + brand +
    (onLanding ? '<nav class="nav" aria-label="Sections">' + FUNNEL.landing.nav.map(function(n){ return '<a href="' + esc(n[1]) + '">' + esc(n[0]) + '</a>'; }).join('') + '</nav>' +
      pill(FUNNEL.offer.cta, FUNNEL.offer.ctaHref || '#price', 'pri sm') : '') +
    '</div></header>';
  var holder = document.createElement('div'); holder.innerHTML = html;
  while (holder.lastChild) document.body.insertBefore(holder.lastChild, document.body.firstChild);
}

function renderFooter(){
  var f = document.createElement('footer'); f.className = 'site';
  f.innerHTML = '<div class="wrap"><span>' + esc(FUNNEL.brand.footer) + '</span>' + (FUNNEL.draftBadge && FUNNEL.draftBadge.show ? '<span>Concept draft for preview only</span>' : '') + '</div>';
  document.body.appendChild(f);
}

/* A sliding rail: drifts slowly on its own, pauses when touched, hovered or focused, and can be dragged,
   scrolled or moved with the arrows. The cards repeat so it loops without a jump. */
function rail(el, speed){
  var track = el.firstElementChild, orig = [].slice.call(track.children);
  var pos = 0, setW = 0, hover = false, lastUser = 0, visible = true, last = 0, moved = false, down = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function build(){
    [].slice.call(track.querySelectorAll('[data-clone]')).forEach(function(n){ n.parentNode.removeChild(n); });
    var gap = parseFloat(getComputedStyle(track).columnGap) || 0, a = orig[0], z = orig[orig.length - 1];
    setW = z.offsetLeft + z.offsetWidth - a.offsetLeft + gap;
    var copies = Math.ceil(2 + el.clientWidth / setW) + 1;
    for (var c = 1; c < copies; c++) orig.forEach(function(n){
      var k = n.cloneNode(true); k.setAttribute('data-clone', ''); k.setAttribute('aria-hidden', 'true');
      [].forEach.call(k.querySelectorAll('button,a,input'), function(x){ x.tabIndex = -1; });
      track.appendChild(k);
    });
    pos = setW; el.scrollLeft = pos;
  }
  function wrap(){
    if (el.scrollLeft >= 2 * setW) { el.scrollLeft -= setW; pos = el.scrollLeft; }
    else if (el.scrollLeft < 1) { el.scrollLeft += setW; pos = el.scrollLeft; }
  }
  function flippedInView(){
    var er = el.getBoundingClientRect();
    return [].some.call(el.querySelectorAll('.flip.on'), function(f){ var r = f.getBoundingClientRect(); return r.right > er.left && r.left < er.right; });
  }
  function kb(){ try { return el.matches(':focus-visible') || !!el.querySelector(':focus-visible'); } catch(e){ return false; } }
  function active(){ return !reduce && visible && !hover && !kb() && !document.hidden && performance.now() - lastUser > 3000 && !flippedInView(); }
  el.addEventListener('scroll', function(){
    if (Math.abs(el.scrollLeft - pos) > 2) { pos = el.scrollLeft; lastUser = performance.now(); }
    wrap();
  }, { passive: true });
  ['wheel', 'touchstart', 'keydown'].forEach(function(n){ el.addEventListener(n, function(){ lastUser = performance.now(); }, { passive: true }); });
  el.addEventListener('pointerenter', function(e){ if (e.pointerType === 'mouse') hover = true; });
  el.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') { hover = false; lastUser = performance.now() - 2000; } });
  /* mouse drag; touch uses normal swiping */
  el.addEventListener('pointerdown', function(e){
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    down = { x: e.clientX, s: el.scrollLeft }; moved = false; lastUser = performance.now();
  });
  window.addEventListener('pointermove', function(e){
    if (!down) return;
    var dx = e.clientX - down.x;
    if (Math.abs(dx) > 5) { moved = true; el.classList.add('drag'); }
    if (moved) el.scrollLeft = down.s - dx;
  });
  window.addEventListener('pointerup', function(){ down = null; el.classList.remove('drag'); });
  el.addEventListener('click', function(e){ if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
  if ('IntersectionObserver' in window) new IntersectionObserver(function(en){ visible = en[0].isIntersecting; }).observe(el);
  function loop(t){
    var dt = Math.min(.05, (t - last) / 1000); last = t;
    if (active()) { pos += speed * dt; el.scrollLeft = pos; }
    requestAnimationFrame(loop);
  }
  build(); requestAnimationFrame(loop);
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(build, 200); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
  return el;
}

/* One banner in focus, the others half faded at the sides. Click a side banner to bring it forward,
   click the center one to flip it. Swipe, arrows, dots and the keyboard work too. It moves on slowly by itself. */
function coverflow(el, every){
  var cards = [].slice.call(el.querySelectorAll('.fcard')), dots = [].slice.call(el.querySelectorAll('.dot')), n = cards.length;
  var a = 0, hover = false, visible = true, lastMove = performance.now(), downX = null, moved = false;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function posOf(i){ var d = ((i - a) % n + n) % n; return d > n / 2 ? d - n : d; }
  function layout(){
    cards.forEach(function(c, i){
      var d = posOf(i), f = c.querySelector('.flip');
      c.setAttribute('data-pos', Math.max(-2, Math.min(2, d)));
      c.setAttribute('aria-hidden', d === 0 ? 'false' : 'true');
      f.tabIndex = d === 0 ? 0 : -1;
      if (d !== 0 && f.classList.contains('on')) { f.classList.remove('on'); f.setAttribute('aria-pressed', 'false'); }
    });
    dots.forEach(function(x, i){ x.setAttribute('aria-current', i === a ? 'true' : 'false'); });
    note();
  }
  function note(){ var t = el.querySelector('.tapnote'); if (t) t.textContent = el.querySelector('.flip.on') ? t.dataset.back : t.dataset.front; }
  function go(i){ a = ((i % n) + n) % n; lastMove = performance.now(); layout(); }
  function flipped(){ return !!el.querySelector('.flip.on'); }
  el.addEventListener('click', function(e){
    if (moved) { moved = false; e.preventDefault(); e.stopPropagation(); return; }
    var c = e.target.closest('.fcard'); if (!c) return;
    var i = cards.indexOf(c);
    if (posOf(i) !== 0) { e.preventDefault(); go(i); return; }
    var f = c.querySelector('.flip'), on = f.classList.toggle('on');
    f.setAttribute('aria-pressed', on ? 'true' : 'false'); lastMove = performance.now(); note();
  }, true);
  dots.forEach(function(d, i){ d.addEventListener('click', function(){ go(i); }); });
  [].forEach.call(document.querySelectorAll('[data-cf="' + el.id + '"]'), function(b){
    b.addEventListener('click', function(){ go(a + parseInt(b.dataset.dir, 10)); });
  });
  el.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(a - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); go(a + 1); }
  });
  /* Hold the front banner and drag: it tilts toward the drag, then springs back when let go.
     A quick flick sideways moves to the next banner. Dragging from the side banners or the gaps swipes as before. */
  var tilt = null;
  function clamp(v, m){ return Math.max(-m, Math.min(m, v)); }
  function settle(f){
    f.classList.remove('drag'); f.classList.add('rel');
    f.style.setProperty('--rx', '0deg'); f.style.setProperty('--ry', '0deg');
    setTimeout(function(){ f.classList.remove('rel'); }, 800);
  }
  el.addEventListener('pointerdown', function(e){
    moved = false; lastMove = performance.now(); downX = null; tilt = null;
    var f = e.target.closest && e.target.closest('.flip'), c = f && f.closest('.fcard');
    if (f && c && posOf(cards.indexOf(c)) === 0 && (e.pointerType !== 'mouse' || e.button === 0)) tilt = { f: f, x0: e.clientX, y0: e.clientY, t0: performance.now(), drag: false };
    else downX = e.clientX;
  });
  window.addEventListener('pointermove', function(e){
    if (!tilt) return;

  if ('IntersectionObserver' in window) new IntersectionObserver(function(en){ visible = en[0].isIntersecting; }).observe(el);

    if (performance.now() - lastMove >= every) go(a + 1);

    card.addEventListener('click', function(e){
      var b = e.target.closest('.qb'); if (!b) return;
      var q = b.parentNode.querySelector('output'), max = parseInt(b.closest('.mi').dataset.max, 10);
      q.textContent = Math.max(0, Math.min(max, parseInt(q.textContent, 10) + parseInt(b.dataset.d, 10)));
      recalc();
    });
    recalc();
  }
  /* the A la carte button waits until something is ticked; the other package buttons are plain links to the order page */
  [].forEach.call(document.querySelectorAll('a[data-total]'), function(a){
    a.addEventListener('click', function(e){
      if (a.getAttribute('data-total') === '0') {
        e.preventDefault();
        var h = a.parentNode.querySelector('.mhint'); if (h) h.hidden = false;
      }
    });
  });
  /* four or more reviews slide on their own; before/after banners show one at a time */
  if (asRail) rail($('#railQuotes'), 26);
  coverflow($('#cfSamples'), 5500);

  renderBar('landing');
  renderFooter();
})();
</script>
</body>
</html>
